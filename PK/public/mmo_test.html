<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>MMO Test</title>
  <style>
    body{font-family:system-ui,Segoe UI,Apple SD Gothic Neo,Malgun Gothic,sans-serif;background:#0b0f14;color:#e6eef7;margin:0;padding:16px}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    input,button{padding:8px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#e6eef7}
    button{cursor:pointer}
    pre{white-space:pre-wrap;background:rgba(255,255,255,.06);padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.12);max-height:60vh;overflow:auto}
    .hint{opacity:.8;font-size:13px;margin-top:10px}
  </style>
</head>
<body>
  <h2>MMO Test (Auth PHP + World WS)</h2>
  <div class="row">
    <input id="u" value="server" placeholder="username" />
    <input id="p" value="" placeholder="password" type="password" />
    <button id="btnLogin">로그인</button>
    <button id="btnConnect" disabled>WS 접속</button>
  </div>
  <div class="hint">
    - 먼저 <code>db/create_local_player_windows.bat</code>를 1회 실행해서 로컬 계정(server)을 만들어둔 상태여야 합니다.<br/>
    - World 서버는 별도 실행: <code>server_world</code> 폴더에서 <code>npm i</code> 후 <code>node index.js</code>
  </div>
  <pre id="log"></pre>

<script>
const logEl = document.getElementById('log');
const log = (...a)=>{logEl.textContent += a.map(x=>typeof x==='string'?x:JSON.stringify(x,null,2)).join(' ') + "\n"; logEl.scrollTop=1e9;};
let token=null;
let ws=null;

// Arrow keys -> move
window.addEventListener('keydown', (e)=>{
  if (!ws || ws.readyState !== 1) return;
  const k = e.key;
  let dir = null;
  if (k === 'ArrowDown') dir = 0;
  else if (k === 'ArrowUp') dir = 1;
  else if (k === 'ArrowLeft') dir = 2;
  else if (k === 'ArrowRight') dir = 3;
  if (dir === null) return;
  e.preventDefault();
  ws.send(JSON.stringify({t:'move', dir}));
});

document.getElementById('btnLogin').onclick = async ()=>{
  token=null;
  document.getElementById('btnConnect').disabled = true;
  const username=document.getElementById('u').value.trim();
  const password=document.getElementById('p').value;
  log('LOGIN...');
  const r=await fetch('../api/auth/login.php', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username,password})});
  const j=await r.json().catch(()=>null);
  log('LOGIN RES', j);
  if(j && j.ok){ token=j.token; document.getElementById('btnConnect').disabled=false; }
};

document.getElementById('btnConnect').onclick = ()=>{
  if(!token) return;
  const url = `ws://${location.hostname}:3090`;
  log('WS connecting...', url);
  ws = new WebSocket(url);
  ws.onopen=()=>{
    log('WS open');
    ws.send(JSON.stringify({t:'hello', token, client:{name:'web', ver:'mmo_test'}}));
  };
  ws.onmessage=(ev)=>{
    let j=null; try{ j=JSON.parse(ev.data);}catch(e){ log('WS msg (raw)', ev.data); return; }
    log('WS msg', j);
  };
  ws.onclose=(ev)=>log('WS close', {code:ev.code, reason:ev.reason});
  ws.onerror=(e)=>log('WS error', e);
};
</script>
</body>
</html>
